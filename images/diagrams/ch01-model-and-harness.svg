<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The model and the harness</title>
<desc>Two places. On the left, a large box labeled your computer holds three things: you; the harness, which is Claude Code; and your files and terminal. On the right, outside your computer, Anthropic's servers run the model, which takes text in and sends text out and stores nothing between requests. Inside the harness, the top row builds each request from the conversation, system instructions, CLAUDE.md, and the tool list; the request goes over the internet to the model. The model's reply comes back into the bottom row, which finds tool calls, checks each call against hooks and permissions, runs the tool on your files and terminal, and adds the result to the conversation as text. You type a message into the conversation; when the reply has no tool call, the harness shows it to you. You never send anything to the model directly, and the model never touches your computer: everything passes through the harness.</desc>
