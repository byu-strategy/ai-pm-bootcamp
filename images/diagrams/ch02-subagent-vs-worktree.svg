<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t5 d5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t5">Subagents versus worktrees</title>
  <desc id="d5">Two panels. Left, Subagent, inside one session: your session's window sends a task description down to a subagent, which has its own, empty window that fills with many lines of reading. Only a single highlighted line, the summary, comes back up into your session. Right, Worktree, for two sessions in parallel: session A works in the my-app folder on main, and session B works in a separate fix-login folder on its own branch. Both folders sit on one shared repository history. A note says ignored files such as .env start out missing in the new folder.</desc>
  <defs>
    <linearGradient id="sw-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EDF0F3"/>
    </linearGradient>
    <linearGradient id="sw-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3F6A"/>
      <stop offset="100%" stop-color="#001A36"/>
    </linearGradient>
    <linearGradient id="sw-folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3FA"/>
      <stop offset="100%" stop-color="#D3E1F1"/>
    </linearGradient>
    <marker id="sw-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/>
    </marker>
    <marker id="sw-royal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/>
    </marker>
    <filter id="sw-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a2e4d" flood-opacity="0.14"/>
    </filter>
    <clipPath id="sw-c1"><rect x="64" y="104" width="384" height="136" rx="8"/></clipPath>
    <clipPath id="sw-c2"><rect x="64" y="332" width="384" height="184" rx="8"/></clipPath>
    <clipPath id="sw-c3"><rect x="540" y="104" width="190" height="84" rx="8"/></clipPath>
    <clipPath id="sw-c4"><rect x="758" y="104" width="190" height="84" rx="8"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="8" fill="#FAFBFC"/>

  <!-- ===================== LEFT: SUBAGENT ===================== -->
  <rect x="24" y="16" width="464" height="528" rx="10" fill="url(#sw-panel)"/>
  <text x="64" y="54" font-size="20" font-weight="700" fill="#002E5D" letter-spacing="0.5">SUBAGENT</text>
  <text x="64" y="80" font-size="17" fill="#5A6672">a helper inside one session</text>

  <!-- Main session window -->
  <g filter="url(#sw-shadow)"><rect x="64" y="104" width="384" height="136" rx="8" fill="#FFFFFF"/></g>
  <g clip-path="url(#sw-c1)"><rect x="64" y="104" width="384" height="32" fill="url(#sw-bar)"/></g>
  <g transform="translate(79.0,109.0) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></g>
  <text x="110" y="126" font-size="17" font-weight="600" fill="#FFFFFF">Your session</text>
  <rect x="88" y="156" width="250" height="9" rx="4.5" fill="#D9DEE4"/>
  <rect x="88" y="176" width="190" height="9" rx="4.5" fill="#D9DEE4"/>
  <rect x="88" y="208" width="140" height="11" rx="5.5" fill="#0057B8"/>

  <!-- Subagent window -->
  <g filter="url(#sw-shadow)"><rect x="64" y="332" width="384" height="184" rx="8" fill="#FFFFFF"/></g>
  <g clip-path="url(#sw-c2)"><rect x="64" y="332" width="384" height="32" fill="url(#sw-bar)"/></g>
  <g transform="translate(79.0,337.0) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" /> <path d="M15 13v2" /> <path d="M9 13v2" /></g>
  <text x="110" y="354" font-size="17" font-weight="600" fill="#FFFFFF">Subagent: its own window</text>
  <rect x="88" y="380" width="300" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="395" width="250" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="410" width="320" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="425" width="190" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="440" width="190" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="455" width="190" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="470" width="190" height="7" rx="3.5" fill="#E3E7EB"/>
  <rect x="88" y="485" width="190" height="7" rx="3.5" fill="#E3E7EB"/>
    <text x="300" y="452" font-size="15" fill="#5A6672">50 files read</text>
  <text x="300" y="472" font-size="15" fill="#5A6672">stay in here</text>

  <!-- Arrows -->
  <line x1="150" y1="246" x2="150" y2="324" stroke="#5A6672" stroke-width="2.5" marker-end="url(#sw-navy)"/>
  <text x="164" y="284" font-size="17" fill="#5A6672">task</text>
  <text x="164" y="304" font-size="17" fill="#5A6672">description</text>
  <line x1="362" y1="326" x2="362" y2="250" stroke="#0057B8" stroke-width="3" marker-end="url(#sw-royal)"/>
  <text x="376" y="284" font-size="17" font-weight="700" fill="#0057B8">summary</text>
  <text x="376" y="304" font-size="17" font-weight="700" fill="#0057B8">only</text>

  <!-- ===================== RIGHT: WORKTREE ===================== -->
  <rect x="512" y="16" width="464" height="528" rx="10" fill="url(#sw-panel)"/>
  <text x="540" y="54" font-size="20" font-weight="700" fill="#002E5D" letter-spacing="0.5">WORKTREE</text>
  <text x="540" y="80" font-size="17" fill="#5A6672">two sessions at once</text>

  <!-- Session A -->
  <g filter="url(#sw-shadow)"><rect x="540" y="104" width="190" height="84" rx="8" fill="#FFFFFF"/></g>
  <g clip-path="url(#sw-c3)"><rect x="540" y="104" width="190" height="32" fill="url(#sw-bar)"/></g>
  <g transform="translate(555.0,109.0) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5" /> <line x1="12" x2="20" y1="19" y2="19" /></g>
  <text x="586" y="126" font-size="17" font-weight="600" fill="#FFFFFF">Session A</text>
  <rect x="560" y="154" width="130" height="8" rx="4" fill="#D9DEE4"/>
  <rect x="560" y="168" width="96" height="8" rx="4" fill="#D9DEE4"/>

  <!-- Session B -->
  <g filter="url(#sw-shadow)"><rect x="758" y="104" width="190" height="84" rx="8" fill="#FFFFFF"/></g>
  <g clip-path="url(#sw-c4)"><rect x="758" y="104" width="190" height="32" fill="url(#sw-bar)"/></g>
  <g transform="translate(773.0,109.0) scale(0.9167)" fill="none" stroke="#FFFFFF" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5" /> <line x1="12" x2="20" y1="19" y2="19" /></g>
  <text x="804" y="126" font-size="17" font-weight="600" fill="#FFFFFF">Session B</text>
  <rect x="778" y="154" width="130" height="8" rx="4" fill="#D9DEE4"/>
  <rect x="778" y="168" width="96" height="8" rx="4" fill="#D9DEE4"/>

  <line x1="635" y1="194" x2="635" y2="234" stroke="#5A6672" stroke-width="2.5" marker-end="url(#sw-navy)"/>
  <line x1="853" y1="194" x2="853" y2="234" stroke="#5A6672" stroke-width="2.5" marker-end="url(#sw-navy)"/>

  <!-- Folder A -->
  <g filter="url(#sw-shadow)">
    <path d="M540,250 Q540,242 548,242 L604,242 L616,254 L722,254 Q730,254 730,262 L730,352 Q730,360 722,360 L548,360 Q540,360 540,352 Z" fill="url(#sw-folder)" stroke="#002E5D" stroke-width="1.5"/>
  </g>
  <text x="635" y="298" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">my-app/</text>
  <text x="635" y="326" text-anchor="middle" font-size="17" fill="#2C3E50">branch main</text>

  <!-- Folder B -->
  <g filter="url(#sw-shadow)">
    <path d="M758,250 Q758,242 766,242 L822,242 L834,254 L940,254 Q948,254 948,262 L948,352 Q948,360 940,360 L766,360 Q758,360 758,352 Z" fill="url(#sw-folder)" stroke="#002E5D" stroke-width="1.5"/>
  </g>
  <text x="853" y="298" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">fix-login/</text>
  <text x="853" y="326" text-anchor="middle" font-size="17" fill="#2C3E50">its own branch</text>

  <!-- Connectors to shared history -->
  <line x1="635" y1="362" x2="635" y2="404" stroke="#8A939C" stroke-width="2"/>
  <line x1="853" y1="362" x2="853" y2="404" stroke="#8A939C" stroke-width="2"/>

  <!-- Shared history -->
  <rect x="540" y="404" width="408" height="60" rx="8" fill="url(#sw-bar)" filter="url(#sw-shadow)"/>
  <g transform="translate(567.0,417.0) scale(1.4167)" fill="none" stroke="#FFFFFF" stroke-width="1.694" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /> <line x1="3" x2="9" y1="12" y2="12" /> <line x1="15" x2="21" y1="12" y2="12" /></g>
  <text x="612" y="440" font-size="17" font-weight="600" fill="#FFFFFF">one shared repository history</text>

  <text x="744" y="506" text-anchor="middle" font-size="15" fill="#5A6672">Ignored files such as .env start out missing</text>
</svg>
