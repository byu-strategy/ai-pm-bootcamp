<title>The six builder axes</title>
<desc>A hexagon with six axes, one per corner, clockwise from the upper left: Agentic Workflow, Discovery, Design, Launch and Learn, AI Systems, and Application Architecture. Each corner has an icon. Faint rings inside the hexagon mark levels from the center (beginner) to the edge (expert); a student's profile is drawn on this frame.</desc>
