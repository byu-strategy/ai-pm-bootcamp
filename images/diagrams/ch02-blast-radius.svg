<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Blast radius: how far an action reaches, and how you undo it</title>
<desc>A grid with three columns and three rows. Columns: Claude edits a file with its edit tool; a command deletes a folder, for example rm -rf drafts/; and an action that leaves your laptop: a push, a deploy, a write to the live database, or an email. The first two stay on your laptop; the third reaches other people, and is highlighted. Row, how to undo it: /rewind; git, only if you committed; no undo, only a new fix later. Row, so you: let it run without asking; commit before it runs; approve it yourself.</desc>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.12"/></filter>
<linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1565C8"/><stop offset="1" stop-color="#0057B8"/></linearGradient></defs>
<rect width="1000" height="510" rx="8" fill="#FAFBFC"/>

<path d="M230,62 L230,52 L720,52 L720,62" fill="none" stroke="#5A6672" stroke-width="1.5"/><text x="475.0" y="40" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.3" fill="#5A6672">STAYS ON YOUR LAPTOP</text>
<path d="M730,62 L730,52 L970,52 L970,62" fill="none" stroke="#0057B8" stroke-width="1.5"/><text x="850.0" y="40" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.3" fill="#0057B8">REACHES OTHER PEOPLE</text>
<rect x="718" y="70" width="264" height="430" rx="12" fill="#E6EEF7"/>
<text x="40" y="180.0" font-size="15" font-weight="700" letter-spacing="1.3" fill="#8A939C">WHAT HAPPENS</text>
<text x="40" y="340.0" font-size="15" font-weight="700" letter-spacing="1.3" fill="#8A939C">HOW TO UNDO IT</text>
<text x="40" y="450.0" font-size="15" font-weight="700" letter-spacing="1.3" fill="#8A939C">SO YOU</text>
<rect x="230" y="80" width="240" height="190" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="350.0" cy="128" r="30" fill="#E6EEF7"/><g transform="translate(335,113) scale(1.25)" fill="none" stroke="#002E5D" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="M13.378 15.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></g>
<text x="350.0" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">Claude edits a file</text>
<text x="350.0" y="216" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#5A6672">with its edit tool</text>
<rect x="480" y="80" width="240" height="190" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="600.0" cy="128" r="30" fill="#E6EEF7"/><g transform="translate(585,113) scale(1.25)" fill="none" stroke="#002E5D" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5" />
  <line x1="12" x2="20" y1="19" y2="19" /></g>
<text x="600.0" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">A command deletes</text>
<text x="600.0" y="216" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#5A6672">a folder, such as</text>
<text x="600.0" y="240" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#5A6672">rm -rf drafts/</text>
<rect x="730" y="80" width="240" height="190" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="850.0" cy="128" r="30" fill="#E6EEF7"/><g transform="translate(835,113) scale(1.25)" fill="none" stroke="#0057B8" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
  <path d="M2 12h20" /></g>
<text x="850.0" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">It leaves your laptop</text>
<text x="850.0" y="216" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#5A6672">push, deploy,</text>
<text x="850.0" y="240" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#5A6672">live database, email</text>
<rect x="230" y="290" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="350.0" y="340" text-anchor="middle" font-size="18" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#2C3E50">/rewind</text>
<rect x="230" y="400" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.8"/>
<text x="350.0" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#002E5D">Let it run</text>
<text x="350.0" y="463" text-anchor="middle" font-size="18" font-weight="400" fill="#002E5D">without asking</text>
<rect x="480" y="290" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="600.0" y="328" text-anchor="middle" font-size="18" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#2C3E50">git, only if</text>
<text x="600.0" y="353" text-anchor="middle" font-size="18" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#2C3E50">you committed</text>
<rect x="480" y="400" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.8"/>
<text x="600.0" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#002E5D">Commit before</text>
<text x="600.0" y="463" text-anchor="middle" font-size="18" font-weight="400" fill="#002E5D">it runs</text>
<rect x="730" y="290" width="240" height="90" rx="10" fill="url(#nav)" stroke="#0057B8" stroke-width="1.5"/>
<text x="850.0" y="328" text-anchor="middle" font-size="18" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#FFFFFF">no undo; only</text>
<text x="850.0" y="353" text-anchor="middle" font-size="18" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#FFFFFF">a new fix, later</text>
<rect x="730" y="400" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.8"/>
<text x="850.0" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#002E5D">Approve it</text>
<text x="850.0" y="463" text-anchor="middle" font-size="18" font-weight="400" fill="#002E5D">yourself</text>
</svg>