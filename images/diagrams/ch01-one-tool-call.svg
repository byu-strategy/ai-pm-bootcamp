<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>One tool call, step by step</title>
<desc>A sequence of four messages between two columns: the model on the left, and Claude Code, running on your computer, on the right. 1: Claude Code sends the model the list of tools the model can call, for example Read with a file path, Edit with a file path and the old and new text, and Bash with a command, plus tools from MCP servers. 2: the model sends back a tool call, which is text naming a tool and its inputs: Edit, file app.py, old text todos.remove(item), new text todos.remove(item) followed by save(todos). The model's reply ends there; nothing on your computer has changed yet. 3: Claude Code checks the call: a hook can block it, then a permission rule allows it, asks you, or denies it. Then Claude Code runs the tool and app.py changes on disk. 4: Claude Code sends a new request: the whole conversation so far plus the result, Updated app.py or an error message. The model keeps nothing between requests, so it reads all of it and decides the next step: another tool call, or a reply to you.</desc>
<defs>
<linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3F6A"/><stop offset="1" stop-color="#002E5D"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.13"/></filter>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/></marker>
</defs>
<rect width="1000" height="800" rx="8" fill="#FAFBFC"/>
<!-- lifelines -->
<line x1="160" y1="130" x2="160" y2="750" stroke="#D9DEE4" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="820" y1="130" x2="820" y2="750" stroke="#D9DEE4" stroke-width="2" stroke-dasharray="5 6"/>
<!-- heads -->
<rect x="45" y="30" width="230" height="100" rx="14" fill="url(#nav)" filter="url(#sh)"/>
<g transform="translate(144,44) scale(1.333)" fill="none" stroke="#FFFFFF" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></g>
<text x="160" y="100" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">The model</text>
<text x="160" y="120" text-anchor="middle" font-size="15" fill="#C9D8EA">writes text only</text>
<rect x="670" y="30" width="300" height="100" rx="14" fill="#FFFFFF" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(804,44) scale(1.333)" fill="none" stroke="#002E5D" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" /></g>
<text x="820" y="100" text-anchor="middle" font-size="21" font-weight="700" fill="#002E5D">Claude Code</text>
<text x="820" y="120" text-anchor="middle" font-size="15" fill="#5A6672">runs on your computer</text>

<path d="M820,200 L168,200" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>
<rect x="280" y="150" width="380" height="138" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="2"/><circle cx="280" cy="150" r="14" fill="#0057B8"/><text x="280" y="155.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text><text x="302" y="180" font-size="17" font-weight="700" fill="#0057B8">Tools the model can call</text><text x="302" y="208" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">Read(file_path)</text><text x="302" y="231" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">Edit(file_path, old, new)</text><text x="302" y="254" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">Bash(command)   + MCP tools</text>
<path d="M160,400 L812,400" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>
<rect x="280" y="348" width="380" height="152" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="2"/><circle cx="280" cy="348" r="14" fill="#0057B8"/><text x="280" y="353.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text><text x="302" y="378" font-size="17" font-weight="700" fill="#0057B8">Tool call</text><text x="302" y="406" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">Edit  file: app.py</text><text x="302" y="429" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">old: todos.remove(item)</text><text x="302" y="452" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">new: todos.remove(item)</text><text x="347" y="475" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">save(todos)</text>
<text x="160" y="440" text-anchor="middle" font-size="15" fill="#5A6672" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">its reply ends here</text>
<rect x="695" y="458" width="250" height="56" rx="9" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="695" cy="458" r="14" fill="#0057B8"/><text x="695" y="463.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<circle cx="723" cy="486" r="17" fill="#E6EEF7"/><g transform="translate(713,476) scale(0.8333)" fill="none" stroke="#002E5D" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g>
<text x="750" y="482" font-size="16" font-weight="600" fill="#2C3E50">Hook</text>
<text x="750" y="502" font-size="15" fill="#5A6672">can block it</text>
<rect x="695" y="528" width="250" height="56" rx="9" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="723" cy="556" r="17" fill="#E6EEF7"/><g transform="translate(713,546) scale(0.8333)" fill="none" stroke="#002E5D" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
<text x="750" y="552" font-size="16" font-weight="600" fill="#2C3E50">Permission</text>
<text x="750" y="572" font-size="15" fill="#5A6672">allow, ask you, deny</text>
<rect x="695" y="598" width="250" height="56" rx="9" fill="#FFFFFF" stroke="#0057B8" stroke-width="1.5"/>
<circle cx="723" cy="626" r="17" fill="#E6EEF7"/><g transform="translate(713,616) scale(0.8333)" fill="none" stroke="#0057B8" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" /></g>
<text x="750" y="622" font-size="16" font-weight="600" fill="#2C3E50">Run the tool</text>
<text x="750" y="642" font-size="15" fill="#5A6672">app.py changes</text>
<path d="M820,712 L168,712" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>
<rect x="280" y="656" width="380" height="108" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="2"/><circle cx="280" cy="656" r="14" fill="#0057B8"/><text x="280" y="661.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text><text x="302" y="686" font-size="17" font-weight="700" fill="#0057B8">Next request</text><text x="302" y="714" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">whole conversation so far</text><text x="302" y="737" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">+ Updated app.py, or an error</text>
<text x="160" y="746" text-anchor="middle" font-size="15" fill="#5A6672" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">reads it all, then</text><text x="160" y="767" text-anchor="middle" font-size="15" fill="#5A6672" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">calls again or replies</text>
</svg>