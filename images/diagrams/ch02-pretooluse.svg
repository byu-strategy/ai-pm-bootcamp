<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>PreToolUse, up close</title>
<desc>One tool call as five steps from left to right: the model asks to commit, git commit; the PreToolUse hook; the permission rules (deny, ask, allow); the tool runs and the commit is made; the PostToolUse hook, which can react but cannot undo. The first three steps sit in a region labeled nothing has happened yet; the last two sit in a region labeled already happened. The PreToolUse step is highlighted and expanded below. What it sees: the exact command as JSON, tool_name Bash and tool_input with the command git commit, before anything has run. Its four answers: exit 0, continue to the permission rules; exit 2 or deny, blocked, and the reason goes to the model; ask, ask you before it runs; allow, skip the prompt, though deny rules still win. Two notes at the bottom: it runs in every permission mode, even bypass; it sees only the tools its matcher names.</desc>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/></marker><linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B3D73"/><stop offset="1" stop-color="#002E5D"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.13"/></filter></defs>
<rect width="1000" height="680" rx="8" fill="#FAFBFC"/>
<rect x="20" y="24" width="585" height="196" rx="12" fill="#EEF4FB"/>
<rect x="613" y="24" width="367" height="196" rx="12" fill="#ECEEF1"/>
<text x="36" y="52" font-size="15" font-weight="700" fill="#0057B8" text-anchor="start" letter-spacing="1.5">NOTHING HAS HAPPENED YET</text>
<text x="629" y="52" font-size="15" font-weight="700" fill="#5A6672" text-anchor="start" letter-spacing="1.5">ALREADY HAPPENED</text>
<rect x="34" y="78" width="150" height="124" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="109.0" y="122" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">Model asks</text>
<text x="109.0" y="144" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">to commit</text>
<text x="109.0" y="178" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">git commit</text>
<rect x="214" y="72" width="186" height="136" rx="12" fill="url(#nav)" filter="url(#sh)"/>
<g transform="translate(293,90) scale(1.167)" fill="none" stroke="#FFFFFF" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g>

<text x="307.0" y="150" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">PreToolUse</text>
<text x="307.0" y="174" font-size="15" font-weight="400" fill="#C9D8EA" text-anchor="middle">your script decides</text>
<rect x="430" y="78" width="160" height="124" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="510.0" y="122" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">Permission</text>
<text x="510.0" y="144" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">rules</text>
<text x="510.0" y="178" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">deny / ask / allow</text>
<rect x="627" y="78" width="146" height="124" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="700.0" y="122" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">Tool runs</text>
<text x="700.0" y="178" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">commit is made</text>
<rect x="803" y="78" width="164" height="124" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="885.0" y="120" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">PostToolUse</text>
<text x="885.0" y="146" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">hook</text>
<text x="885.0" y="172" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">can react,</text>
<text x="885.0" y="190" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">cannot undo</text>
<line x1="187" y1="140.0" x2="209" y2="140.0" stroke="#8A939C" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="403" y1="140.0" x2="425" y2="140.0" stroke="#8A939C" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="593" y1="140.0" x2="622" y2="140.0" stroke="#8A939C" stroke-width="1.8" marker-end="url(#ag)"/>
<line x1="776" y1="140.0" x2="798" y2="140.0" stroke="#8A939C" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M214,208 L60,266" stroke="#0057B8" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
<path d="M400,208 L940,266" stroke="#0057B8" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
<rect x="60" y="266" width="880" height="294" rx="14" fill="#FFFFFF" stroke="#0057B8" stroke-width="2"/>
<text x="90" y="306" font-size="19" font-weight="700" fill="#0057B8" text-anchor="start">What it sees</text>
<rect x="90" y="326" width="322" height="104" rx="8" fill="#F4F7FB" stroke="#D9DEE4" stroke-width="1.2"/>
<text x="108" y="358" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">"tool_name": "Bash",</text>
<text x="108" y="384" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">"tool_input": {</text>
<text x="108" y="410" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  "command": "git commit ..." }</text>
<text x="90" y="462" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">the exact command, before</text>
<text x="90" y="482" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">anything has run</text>
<text x="430" y="306" font-size="19" font-weight="700" fill="#0057B8" text-anchor="start">What it can answer</text>
<rect x="430" y="326" width="480" height="42" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="446" y="353" font-size="15" font-weight="700" fill="#002E5D" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">exit 0</text>
<text x="578" y="353" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">Continue to permission rules</text>
<rect x="430" y="378" width="480" height="42" rx="8" fill="#0057B8" stroke="#0057B8" stroke-width="1.5"/>
<text x="446" y="405" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">exit 2, deny</text>
<text x="578" y="405" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Blocked; reason goes to the model</text>
<rect x="430" y="430" width="480" height="42" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="446" y="457" font-size="15" font-weight="700" fill="#002E5D" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">ask</text>
<text x="578" y="457" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">Ask you before it runs</text>
<rect x="430" y="482" width="480" height="42" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="446" y="509" font-size="15" font-weight="700" fill="#002E5D" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">allow</text>
<text x="578" y="509" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">Skip the prompt (deny rules win)</text>
<g transform="translate(80,598) scale(0.9167)" fill="none" stroke="#5A6672" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g>

<text x="112" y="615" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">Runs in every permission mode, even bypass</text>
<g transform="translate(530,598) scale(0.9167)" fill="none" stroke="#5A6672" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
  <path d="M12 9v4" />
  <path d="M12 17h.01" /></g>

<text x="562" y="615" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">Sees only the tools its matcher names</text>
</svg>