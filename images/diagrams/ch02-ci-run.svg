<circle cx="52" cy="362.0" r="22" fill="#E6EEF7"/>
<g transform="translate(40,350) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
