<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 594" role="img" aria-labelledby="ci-t ci-d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="ci-t">What continuous integration does, and why it becomes the bottleneck</title>
<desc id="ci-d">Two parts. Top: what one CI run does. A git push sends the latest commit to GitHub, and an arrow leads into a panel labeled GitHub Actions runner, a fresh virtual machine, holding four numbered steps in order: check out the code, install packages, build the app, run the tests. From the last step, one arrow leads to a green check labeled pass, and another to a red X labeled fail. Bottom: two horizontal bars on one scale of 0 to 51 minutes, labeled illustrative. One change, by a person: writing code, 41 min, then CI, 10 min; 51 minutes in all. One change, by an AI agent: writing code, 3 min, then CI, 10 min; 13 minutes in all. The CI segment is the same length in both bars, so for the agent it is most of the time the change takes.</desc>
<defs>
<marker id="ci-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002E5D"/></marker>
<marker id="ci-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4C"/></marker>
<marker id="ci-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A3A"/></marker>
<linearGradient id="ci-zone" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EDF3FA"/><stop offset="100%" stop-color="#DCE7F3"/></linearGradient>
<linearGradient id="ci-run" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1A6BC6"/><stop offset="100%" stop-color="#004A9E"/></linearGradient>
<filter id="ci-sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0a2e4d" flood-opacity="0.12"/></filter>
</defs>
