<svg viewBox="0 0 1000 1240" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Anatomy of a Claude Code hook</title>
<desc>Two parts. Top, when hooks fire: the agent loop as five steps in a row. Session starts, then you send a message, then the model asks for a tool, then the tool runs; the last two repeat until the model replies with no tool call, and then the model finishes its reply. Four hook events are pinned to the loop: SessionStart when the session starts, PreToolUse between the model asking for a tool and the tool running, PostToolUse right after the tool runs, and Stop when the model finishes. Bottom, one hook step by step, in three columns: the model, Claude Code, and your hook script. 1: the model sends a tool call: Bash, git commit -m 'Add delete button'. 2: Claude Code checks its hook settings: the event is PreToolUse and the matcher Bash matches, so the hook runs. 3: Claude Code sends the hook script the planned action as JSON: tool_name Bash, and tool_input with the command git commit. 4: the script finds no review recorded for these changes, so it prints a reason and exits with code 2. 5: the script returns the exit code to Claude Code, which acts on it. Exit 0: no objection, and the commit continues to the permission check. Exit 2: the commit is blocked, and an arrow carries the reason the script printed to the model, which can review the changes and try again. Any other exit code, such as 1: Claude Code shows a warning and the commit still continues.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/></marker><linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B3D73"/><stop offset="1" stop-color="#002E5D"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
