<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">A history of product management, 1940s to 2025</title>
<desc id="d">A timeline drawn to scale from 1980 to 2025, with a break before it for the 1940s. 1940s: product manager becomes a job title at Hewlett-Packard. 1980s: Intuit and Microsoft create product management roles. 1986: Harvard Business Review publishes The New New Product Development Game. 1995: Ken Schwaber presents SCRUM Development Process. 2001: the Agile Manifesto is published. 2002: Google starts its Associate Product Manager program. 2008: Marty Cagan publishes Inspired. 2014: Product School is founded. 2015: Dan Olsen publishes The Lean Product Playbook. 2018: Carnegie Mellon starts a master's degree in product management. 2019: U.S. News ranks product manager the top hot job for new MBA graduates. 2022: ChatGPT launches, and AI product managers follow. 2025: full-stack product builders emerge, highlighted. Events crowd together after 2000.</desc>
