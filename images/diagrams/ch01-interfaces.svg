<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Ways to tell a computer what to do</title>
<desc>A boundary labeled your computer holds you, three programs side by side, the operating system, and the hardware. The programs are GUI apps, which you click; the terminal and shell, where you type commands; and Claude Code, which you talk to in plain English. Claude Code also hands commands to the shell. Each program has an arrow down to the operating system (macOS, Windows, or Linux), which handles files, programs, and the network, and runs on the hardware. Outside the boundary, a two-way arrow labeled internet connects the operating system to a panel of other computers, each of which offers an API: the Anthropic API, which runs the model, highlighted; the GitHub API; and the Supabase API. The GUI and the shell are side by side: neither goes through the other.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/></marker><marker id="ags" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5A6672"/></marker><linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B3D73"/><stop offset="1" stop-color="#002E5D"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.13"/></filter></defs>
<rect width="1000" height="600" rx="8" fill="#FAFBFC"/>
<rect x="20" y="20" width="700" height="560" rx="16" fill="#F1F5FA" stroke="#B9D0EA" stroke-width="1.5"/>
<g transform="translate(40,36) scale(0.9167)" fill="none" stroke="#5A6672" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" /></g>

<text x="72" y="54" font-size="15" font-weight="700" fill="#5A6672" text-anchor="start" letter-spacing="1.5">YOUR COMPUTER</text>
<circle cx="135" cy="118" r="34" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<g transform="translate(119,102) scale(1.333)" fill="none" stroke="#002E5D" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" /></g>

<text x="135" y="174" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">You</text>
<rect x="44" y="226" width="196" height="120" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="142.0" cy="260" r="20" fill="#E6EEF7"/>
<g transform="translate(130,248) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" />
  <path d="M10 4v4" />
  <path d="M2 8h20" />
  <path d="M6 4v4" /></g>

<text x="142.0" y="308" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">GUI apps</text>
<text x="142.0" y="330" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">windows and buttons</text>
<rect x="262" y="226" width="196" height="120" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="360.0" cy="260" r="20" fill="#E6EEF7"/>
<g transform="translate(348,248) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2" />
  <path d="M11 13h4" />
  <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /></g>

<text x="360.0" y="308" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">Terminal and shell</text>
<text x="360.0" y="330" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">typed commands</text>
<rect x="480" y="226" width="196" height="120" rx="12" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#sh)"/>
<circle cx="578.0" cy="260" r="20" fill="#E6EEF7"/>
<g transform="translate(566,248) scale(1)" fill="none" stroke="#0057B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" /></g>

<text x="578.0" y="308" font-size="18" font-weight="700" fill="#0057B8" text-anchor="middle">Claude Code</text>
<text x="578.0" y="330" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">an agent</text>
<line x1="135" y1="184" x2="135" y2="220" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<text x="146" y="206" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start" paint-order="stroke" stroke="#F1F5FA" stroke-width="6">click</text>
<line x1="160" y1="182" x2="330" y2="220" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<text x="262" y="196" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start" paint-order="stroke" stroke="#F1F5FA" stroke-width="6">type</text>
<path d="M171,112 L578,112 L578,220" fill="none" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<text x="420" y="102" font-size="15" font-weight="600" fill="#5A6672" text-anchor="middle" paint-order="stroke" stroke="#F1F5FA" stroke-width="6">plain English</text>
<path d="M520,224 C520,170 420,170 420,218" fill="none" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="470" y="160" font-size="15" font-weight="600" fill="#0057B8" text-anchor="middle" paint-order="stroke" stroke="#F1F5FA" stroke-width="6">commands</text>
<line x1="142.0" y1="348" x2="142.0" y2="404" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="360.0" y1="348" x2="360.0" y2="404" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="578.0" y1="348" x2="578.0" y2="404" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<rect x="44" y="410" width="632" height="76" rx="12" fill="url(#nav)" filter="url(#sh)"/>
<text x="360" y="444" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">The operating system</text>
<text x="360" y="470" font-size="16" font-weight="400" fill="#C9D8EA" text-anchor="middle">macOS, Windows, Linux: files, programs, network</text>
<rect x="44" y="504" width="632" height="44" rx="10" fill="#E2E7ED"/>
<text x="360" y="532" font-size="17" font-weight="600" fill="#5A6672" text-anchor="middle">Hardware</text>
<rect x="772" y="96" width="208" height="390" rx="14" fill="#FFFFFF" stroke="#B9D0EA" stroke-width="1.5"/>
<g transform="translate(863,112) scale(1.083)" fill="none" stroke="#002E5D" stroke-width="2.03" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></g>

<text x="876.0" y="162" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">Other computers</text>
<text x="876.0" y="184" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">each offers an API</text>
<rect x="788" y="204" width="176" height="68" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="2"/>
<text x="876.0" y="233" font-size="16" font-weight="700" fill="#0057B8" text-anchor="middle">Anthropic API</text>
<text x="876.0" y="255" font-size="15" font-weight="400" fill="#0057B8" text-anchor="middle">runs the model</text>
<rect x="788" y="284" width="176" height="48" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="876.0" y="313" font-size="16" font-weight="600" fill="#002E5D" text-anchor="middle">GitHub API</text>
<rect x="788" y="344" width="176" height="48" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="876.0" y="373" font-size="16" font-weight="600" fill="#002E5D" text-anchor="middle">Supabase API</text>
<line x1="682" y1="440" x2="766" y2="440" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)" marker-start="url(#ags)"/>
<text x="727" y="428" font-size="15" font-weight="600" fill="#5A6672" text-anchor="middle" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">internet</text>
</svg>