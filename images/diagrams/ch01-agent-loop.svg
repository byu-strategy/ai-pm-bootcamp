<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The agent loop inside one turn</title>
<desc>Two loops. The outer loop is you: you send a message, Claude Code works for one turn, Claude replies, and you review and test before sending the next message. Inside one turn is the agent loop: the model decides the next step and either calls a tool or replies. A tool call runs on your computer; tools gather context (read, search), act (edit, run), or check (test, open the app). The tool's result goes back into the conversation and the model decides again. The turn ends when the model replies instead of calling a tool. Pressing Esc stops a turn.</desc>
<defs>
<linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3F6A"/><stop offset="1" stop-color="#002E5D"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.13"/></filter>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/></marker>
</defs>
<rect width="1000" height="500" rx="8" fill="#FAFBFC"/>

<!-- you -->
<circle cx="110" cy="250" r="46" fill="#E6EEF7"/>
<g transform="translate(86,226) scale(2)" fill="none" stroke="#002E5D" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" /></g>
<text x="110" y="326" text-anchor="middle" font-size="21" font-weight="700" fill="#002E5D">You</text>
<text x="110" y="352" text-anchor="middle" font-size="16" fill="#5A6672">review and test,</text>
<text x="110" y="372" text-anchor="middle" font-size="16" fill="#5A6672">then the next message</text>

<!-- one turn panel -->
<rect x="250" y="40" width="720" height="420" rx="14" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<text x="278" y="76" font-size="15" font-weight="700" letter-spacing="1.5" fill="#8A939C">ONE TURN</text>
<text x="942" y="76" text-anchor="end" font-size="15" fill="#8A939C">Esc stops it</text>

<!-- outer arrows -->
<path d="M160,222 L300,222" stroke="#5A6672" stroke-width="2" fill="none" marker-end="url(#aG)"/>
<text x="230" y="208" text-anchor="middle" font-size="16" fill="#5A6672">message</text>
<path d="M300,288 L160,288" stroke="#5A6672" stroke-width="2" fill="none" marker-end="url(#aG)"/>
<text x="230" y="314" text-anchor="middle" font-size="16" fill="#5A6672">reply</text>

<!-- model -->
<rect x="308" y="170" width="190" height="160" rx="14" fill="url(#nav)" filter="url(#sh)"/>
<g transform="translate(385,196) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="1.47" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></g>
<text x="403" y="266" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Model</text>
<text x="403" y="292" text-anchor="middle" font-size="16" fill="#C9D8EA">calls a tool</text>
<text x="403" y="312" text-anchor="middle" font-size="16" fill="#C9D8EA">or replies</text>

<!-- inner loop arrows -->
<path d="M498,205 C560,150 600,140 650,140" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>
<text x="560" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#0057B8">tool call</text>
<path d="M650,360 C600,360 560,350 498,295" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>
<text x="560" y="392" text-anchor="middle" font-size="16" font-weight="600" fill="#0057B8">result</text>
<text x="560" y="412" text-anchor="middle" font-size="15" fill="#5A6672">added to the conversation</text>

<!-- tools -->
<rect x="660" y="100" width="280" height="300" rx="14" fill="#F4F7FB" stroke="#B9D0EA" stroke-width="1.5"/>
<text x="684" y="138" font-size="19" font-weight="700" fill="#002E5D">Tools</text>
<text x="742" y="138" font-size="16" fill="#5A6672">run on your computer</text>
<g>
<rect x="680" y="160" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#D9DEE4"/>
<circle cx="714" cy="192" r="20" fill="#E6EEF7"/><g transform="translate(702,180) scale(1)" fill="none" stroke="#0057B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" />
  <path d="m21 21-4.3-4.3" /></g>
<text x="748" y="187" font-size="18" font-weight="600" fill="#2C3E50">Gather</text>
<text x="748" y="208" font-size="15" fill="#5A6672">read, search</text>
<rect x="680" y="236" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#D9DEE4"/>
<circle cx="714" cy="268" r="20" fill="#E6EEF7"/><g transform="translate(702,256) scale(1)" fill="none" stroke="#0057B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
  <path d="m15 5 4 4" /></g>
<text x="748" y="263" font-size="18" font-weight="600" fill="#2C3E50">Act</text>
<text x="748" y="284" font-size="15" fill="#5A6672">edit, run commands</text>
<rect x="680" y="312" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#D9DEE4"/>
<circle cx="714" cy="344" r="20" fill="#E6EEF7"/><g transform="translate(702,332) scale(1)" fill="none" stroke="#0057B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="m9 12 2 2 4-4" /></g>
<text x="748" y="339" font-size="18" font-weight="600" fill="#2C3E50">Check</text>
<text x="748" y="360" font-size="15" fill="#5A6672">run tests, open the app</text>
</g>
</svg>