project:
  type: book
  output-dir: _book

book:
  title: "AI PM Bootcamp"
  favicon: images/favicon-fullstack.svg
  author: "Scott Murff"
  date: "10/21/2026"
  chapters:
    - index.qmd
    - part: Start Here
      chapters:
        - 00-setup.qmd
        - 01-how-agents-work.qmd
        - 02-directing-the-agent.qmd
        - 03-git-deployment.qmd
        - 04-first-build.qmd
    - part: Workshop
      chapters:
        - 10-the-harness.qmd
        - 11-surfaces.qmd
        - 12-agent-team-kit.qmd
        - 13-spec-to-release.qmd
        - 14-lab.qmd
        - 15-software-factory.qmd
    - part: Sample Apps
      chapters:
        - 80-sample-apps.qmd
    - part: Resources
      chapters:
        - 90-kit-reference.qmd
        - 97-thought-leaders.qmd

# Adds a "Learn in Claude" button to each ## section that states "**The model:**" (_extensions/learn).
# The button copies a prompt that runs the /learn skill from byu-strategy/builder-template.
filters:
  - learn
learn-base-url: "https://byu-strategy.github.io/ai-pm-bootcamp/"

bibliography: references.bib
csl: informs.csl

format:
  html:
    include-in-header: _header.html
    include-after-body: _footer.html
    theme: cosmo
    link-external-newwindow: true
    css: styles.css
    toc: true
    number-sections: false
execute:
  eval: false

mermaid:
  theme: default

toc-title: On this page
